server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ${SERVICE_NAME:order-service}
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_order}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

# Cart Service URL for inter-service communication
cart-service:
  url: ${CART_SERVICE_URL:http://localhost:8083}/api/cart

# Service URLs (for compatibility with different property names)
service:
  cart-url: ${CART_SERVICE_URL:http://localhost:8083}/api/cart

# RabbitMQ Exchange and Queue Configuration
rabbitmq:
  exchange:
    order: order.exchange
  queue:
    payment-request: payment.request.queue
    order-created: order.created.queue
    order-paid: order.paid.queue
  routing-key:
    payment-request: payment.request
    order-created: order.created
    order-paid: order.paid

logging:
  level:
    com.ecommerce: ${LOGGING_LEVEL_COM_ECOMMERCE:INFO}
    org.springframework.security: INFO
    org.springframework.amqp: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized