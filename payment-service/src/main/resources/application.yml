server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ${SERVICE_NAME:payment-service}
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_payment}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10

# Payment Mock Configuration
payment:
  mock:
    enabled: ${PAYMENT_MOCK_ENABLED:true}
    success-rate: ${PAYMENT_MOCK_SUCCESS_RATE:90}

# RabbitMQ Exchange and Queue Configuration
rabbitmq:
  exchange:
    order: order.exchange
  queue:
    payment-request: payment.request.queue
    order-paid: order.paid.queue
    payment-success: payment.success.queue
    payment-failed: payment.failed.queue
  routing-key:
    payment-request: payment.request
    order-paid: order.paid
    payment-success: payment.success
    payment-failed: payment.failed

logging:
  level:
    com.ecommerce: ${LOGGING_LEVEL_COM_ECOMMERCE:INFO}
    org.springframework.amqp: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized