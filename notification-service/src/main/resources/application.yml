server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ${SERVICE_NAME:notification-service}
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_notification}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10

  # Email Configuration (SMTP)
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your-email@gmail.com}
    password: ${SMTP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
    default-encoding: UTF-8

  # Email Sender Configuration
  mail-sender:
    from: ${SMTP_FROM:noreply@ecommerce.com}
    personal: E-Commerce Platform

# SMS Configuration (Twilio - Optional)
sms:
  provider: ${SMS_PROVIDER:twilio}
  twilio:
    account-sid: ${SMS_ACCOUNT_SID:your-account-sid}
    auth-token: ${SMS_AUTH_TOKEN:your-auth-token}
    from-number: ${SMS_FROM_NUMBER:+1234567890}

# Backward compatibility for old property names
notification:
  email:
    from: ${SMTP_FROM:noreply@ecommerce.com}
    personal: E-Commerce Platform

# RabbitMQ Exchange and Queue Configuration - ADD ALL MISSING QUEUES
rabbitmq:
  exchange:
    order: order.exchange
  queue:
    order-created: order.created.queue
    order-paid: order.paid.queue
    payment-success: payment.success.queue
    payment-failed: payment.failed.queue
  routing-key:
    order-created: order.created
    order-paid: order.paid
    payment-success: payment.success
    payment-failed: payment.failed

logging:
  level:
    com.ecommerce: ${LOGGING_LEVEL_COM_ECOMMERCE:INFO}
    org.springframework.amqp: DEBUG
    org.springframework.mail: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized